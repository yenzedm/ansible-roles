---
- name: Install docker static specific version
  block:
    - name: "Download tgz from docker github to {{ docker_dir }}"
      unarchive:
        src: "{{ docker_repo }}{{ os_architecture }}/docker-{{ docker_version }}.tgz"
        dest: "{{ docker_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Create docker group
      group:
        name: docker
        state: present
        
    - name: "Add {{ ansible_user }} to docker group"
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: "Copy all file from install-docker-static/files/ to {{ path_to_systemd }}"
      copy:
        src: "{{ item.src }}"
        dest: "{{ path_to_systemd }}/{{ item.path }}"
        owner: root
        group: root
        mode: '0644'
      with_filetree: "{{ role_path }}/files/"
      when: item.state == 'file'

    - name: Run docker systemd
      systemd_service:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes
        
    - name: Run containerd systemd
      systemd_service:
        name: containerd
        state: started
        enabled: yes
  become: yes
