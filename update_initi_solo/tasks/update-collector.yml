# @eremeev.da
---
- name: "Start {{ collector.collector_type }} collector"
  shell: |
    cd {{ path_to_distrib }}/{{ version }}
    {{ path_to_distrib }}/{{ version }}/{{ collectors.script_name }} start {{ collector.collector_type }}
  environment:
    PATH: "{{ custom_path }}"
  register: collector_start

# Debug
- name: Script output
  debug:
    var: collector_start
  when: update_debug